apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    app: payments-api
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 8000
# Access locally with:
#   kubectl port-forward svc/payments-api 8080:80
# or switch type to NodePort and map the port when creating the k3d cluster.
